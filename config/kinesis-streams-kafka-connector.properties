name=YOUR_CONNECTER_NAME
connector.class=com.amazon.kinesis.kafka.AmazonKinesisSinkConnector
tasks.max=1
topics=YOUR_TOPIC_NAME
region=us-east-1
streamName=YOUR_STREAM_NAME
usePartitionAsHashKey=false
# Kinesis Producer Configuration - https://github.com/awslabs/amazon-kinesis-producer/blob/master/java/amazon-kinesis-producer-sample/default_config.properties
# All kinesis producer configuration have not been exposed
maxBufferedTime=1500
maxConnections=1
rateLimit=100
ttl=60000
metricsLevel=detailed
metricsGranuality=shard
metricsNameSpace=KafkaKinesisStreamsConnector
aggregration=true

# Optional: SAML authentication and KMS-based password decryption for the corporate proxy.
# samlAuthenticationEnabled=true
# externalConfigFile=/path/to/config.properties
# If omitted but profile/username/rolearn/kinesisEndPoint/sysSeq/projSeq/credId/intProxy are all set,
# SAML is enabled (compatible with the legacy SAML connector JSON). Config file: externalConfigFile,
# or env KINESIS_CONNECTOR_EXTERNAL_CONFIG, or default path /usr/hdf/current/kafkaconnect/Jars/config.properties
# profile=AWS_ACCOUNT_ID
# kinesisEndPoint=https://kinesis.us-east-1.amazonaws.com
# username=DOMAIN--USER
# rolearn=arn:aws:iam::ACCOUNT:role/ROLE
# sysSeq=1
# projSeq=1
# credId=1
# intProxy=proxy-host:proxy-port
# samlProviderName=SAML_ADFS3
